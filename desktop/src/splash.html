<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' file:;">
    <title>Enigma</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: #f7f7f8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -webkit-app-region: drag;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4rem;
        }
        .splash-avatar {
            width: 56px; height: 56px;
            border-radius: 50%;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
            box-shadow: none;
            background: #ffffff;
        }
        .splash-text-row {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            justify-content: center;
        }
        .splash-text {
            font-size: 0.9rem;
            color: #65666a;
            letter-spacing: 0.02em;
            line-height: 1.5;
            transition: opacity 0.5s ease;
            white-space: nowrap;
        }
        .splash-text.switching { opacity: 0; }
        .splash-sakura {
            display: inline-flex;
            align-items: center;
            font-size: 1.05rem;
            color: var(--splash-accent, #747579);
            flex-shrink: 0;
            line-height: 1;
            animation: spin 4s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @media (prefers-color-scheme: dark) { body { background: #191a1c; } .splash-text { color: #a0a1a5; } .splash-avatar { background: #1f2023; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <div id="react-root"></div>
    <script src="modules/platform.js"></script>
    <script type="module" src="./splash-main.tsx"></script>
</body>
</html>
